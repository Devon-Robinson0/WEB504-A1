        <div class="contact">

                </div>

                    <input id="subject-input" type="text" placeholder="e.g. website design partnership" />
                </div>
                <div class="input-container">
                    <label for="message-input">MESSAGE</label>
                    <textarea 
                        id="message-input" 
                        placeholder="Describe your reason for contact, what this is about.. etc"
